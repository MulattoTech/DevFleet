services:
  dev:
    image: rocker/r-ver:4.4.2
    user: "root"
    working_dir: /workspaces/__PROJECT_SLUG__
    command: sh -lc "sleep infinity"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/workspaces/__PROJECT_SLUG__:cached
    healthcheck:
      test: ["CMD-SHELL", "test -d /workspaces/__PROJECT_SLUG__"]
      interval: 30s
      timeout: 5s
      retries: 3
